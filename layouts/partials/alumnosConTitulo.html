<div>
    <h1>{{.titulo}}</h1>

    {{ $imagenMd := printf "![Abanderados del {{.ciclo.ciclo}}](%s)" .ciclo.imagen}}
    {{ $imagenMd | markdownify }}
    {{ end }}
    {{range .ciclo.abanderados}}
    <div>
        {{ partial "partialAlumno" . }}
    </div>
    {{ end }}
</div>
